{% if S_PTSL_CAN_VIEW_LIST %}
	<script>

	/**
	 * @var	imcger	object for pphpBB.
	 */
	if (typeof imcger != 'object') {
		var imcger = {};
	}

	(function($) {  // Avoid conflicts with other libraries

		'use strict';

		imcger.plst = {};
		imcger.plst.buttonLink = '';

		imcger.plst.delEntry = function(button) {
			imcger.plst.name	   = button.getAttribute('pts-name');
			imcger.plst.time	   = $('input[name="creation_time"]').attr('value');
			imcger.plst.token	   = $('input[name="form_token"]').attr('value');
			imcger.plst.buttonLink = button.getAttribute('action-link') + '&creation_time=' + imcger.plst.time + '&form_token=' + imcger.plst.token;

			let confirmMsgText = '<h3 class="alert_title">{{ lang("PTSL_TITLE")|e("js") }} - ' + imcger.plst.name + '</h3><div class="alert_text"><p>{{ lang("PTSL_CONFIRMBOX_TEXT")|e("js") }}</p><input type="button" name="confirm" value="{{ lang("YES")|e("js") }}" class="button2">&nbsp;&nbsp;<input type="button" name="cancel" value="{{ lang("NO")|e("js") }}" class="button2"></div>';

			phpbb.confirm(confirmMsgText, imcger.plst.confirmDelEntry, true);
		}

		imcger.plst.confirmDelEntry = function(answerYes) {

			if (answerYes) {
				window.location.replace(imcger.plst.buttonLink);
			}
		}

	})(jQuery); // Avoid conflicts with other libraries
	</script>
{% endif %}
